name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "services/api[dev]" -e packages/novapay-mcp
      - run: python -m ruff check services/api packages/novapay-mcp evals scripts
      - run: python -m mypy services/api/app packages/novapay-mcp/src
      - run: python -m pytest services/api/tests packages/novapay-mcp/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -e "services/api[dev]" -e packages/novapay-mcp
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run critical browser journeys
        shell: bash
        run: |
          python -m uvicorn app.main:app --app-dir services/api --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              npm run test:e2e
              exit $?
            fi
            sleep 1
          done
          cat api.log
          exit 1
