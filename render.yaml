services:
  - type: web
    name: resolveai-showcase-api
    runtime: docker
    plan: free
    region: virginia
    numInstances: 1
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DEPLOYMENT_PROFILE
        value: public_showcase
      - key: AI_PROVIDER
        value: demo
      - key: ENABLE_REAL_AI
        value: "false"
      - key: PERSISTENCE_BACKEND
        value: memory
      - key: PUBLIC_RATE_LIMIT_REQUESTS
        value: "120"
      - key: PUBLIC_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: resolveai-showcase-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: resolveai-showcase-web
    runtime: docker
    plan: free
    region: virginia
    numInstances: 1
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: resolveai-showcase-api
          envVarKey: RENDER_EXTERNAL_URL
